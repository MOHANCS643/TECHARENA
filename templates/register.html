{% extends "base.html" %}

{% block title %}Team Registration{% endblock %}

{% block content %}

<div class="form-container">

    <h2>Team Registration</h2>

    <form method="POST">

        <input
            type="text"
            name="team_name"
            placeholder="Team Name"
            required
        >

        <input
            type="text"
            name="college_name"
            placeholder="College Name"
            required
        >

        <input
            type="text"
            name="leader_name"
            placeholder="Team Leader Name"
            required
        >

        <input
            type="email"
            name="email"
            placeholder="Email Address"
            required
        >

        <input
            type="text"
            name="phone"
            placeholder="Phone Number"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Register
        </button>

    </form>

    <p>

        Already Registered?

        <a href="{{ url_for('auth.login') }}">

            Login Here

        </a>

    </p>

</div>

{% endblock %}
