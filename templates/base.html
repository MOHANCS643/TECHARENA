<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Tech Arena{% endblock %}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <header>

        <div class="logo">
            <h1>TECH ARENA</h1>
        </div>

        <nav>

            <a href="{{ url_for('home.index') }}">Home</a>

            <a href="{{ url_for('auth.login') }}">Team Login</a>

            <a href="{{ url_for('auth.register') }}">Register</a>

            <a href="{{ url_for('home.leaderboard') }}">Leaderboard</a>

            <button id="theme-toggle" class="theme-btn">
    🌙
</button>

        </nav>

    </header>

    <main>

        {% block content %}

        {% endblock %}

    </main>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>

</body>

</html>
