{% extends "base.html" %}

{% block title %}Team Login{% endblock %}

{% block content %}

<div class="login-page">

    <div class="login-card">

        <h2>Welcome Back 👋</h2>

        <p>Login to continue to BYTE HORIZON</p>

        <form method="POST">

            <input
                type="email"
                name="email"
                placeholder="📧 Email Address"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="🔒 Password"
                required
            >

            <button type="submit">

                Login

            </button>

        </form>

        <span>

            New Team?

            <a href="{{ url_for('auth.register') }}">

                Register Here

            </a>

        </span>

    </div>

</div>

{% endblock %}
